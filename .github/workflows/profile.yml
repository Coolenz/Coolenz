name: Refresh profile visuals

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  push:
    branches: [main, profile-tech-refresh-20261031]
    paths:
      - '.github/workflows/profile.yml'
      - 'profile-settings.json'
      - 'scripts/finalize-activity.py'
      - 'README.md'
      - 'README.zh-CN.md'

permissions:
  contents: read

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-settings.json
          MAX_REPOS: '100'

      - name: Generate contribution trace
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/contribution-trace-dark.svg?color_snake=#73efff&color_dots=#102335,#16465e,#207694,#2ab4ce,#73efff
            assets/contribution-trace-light.svg?color_snake=#087c94&color_dots=#e0edf4,#a9d8e6,#69b8cc,#2996ad,#087c94

      - name: Finalize accessible SVGs
        run: python3 scripts/finalize-activity.py

      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/activity-*.svg assets/contribution-trace-*.svg
          if git diff --cached --quiet; then
            echo 'Profile visuals are current.'
            exit 0
          fi
          git commit -m 'chore: refresh public contribution visuals'
          git push
